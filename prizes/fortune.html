<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7d1f19">
<title>中国农历运程</title>
<style>
  :root{
    --ink:#372b20;
    --ink-soft:#584733;
    --muted:#8a7963;
    --red:#8c2f24;
    --red-deep:#6d1f18;
    --gold:#c19a4b;
    --gold-soft:#e3cfa4;
    --line:#e5d7bd;
    --card:#fffdf7;
    --shadow:0 30px 80px -24px rgba(74,45,20,.38), 0 12px 30px -18px rgba(74,45,20,.25);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(140,47,36,.10), transparent 38%),
      radial-gradient(circle at 90% 10%, rgba(193,154,75,.15), transparent 34%),
      radial-gradient(circle at 50% 112%, rgba(140,47,36,.08), transparent 46%),
      linear-gradient(165deg,#fbf7ee 0%,#f4ebda 48%,#efe2cc 100%);
    background-attachment:fixed;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.32;
    background-image:
      repeating-linear-gradient(0deg, rgba(120,90,50,.035) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,90,50,.025) 0 1px, transparent 1px 4px);
    mix-blend-mode:multiply;
  }
  body::after{
    content:"";
    position:fixed;
    width:min(62vw,760px);
    aspect-ratio:1;
    right:-18vw;
    top:-24vw;
    border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle at 38% 38%, rgba(255,250,235,.85), rgba(238,220,180,.32) 45%, transparent 70%);
    filter:blur(2px);
  }
  .page{
    position:relative;
    z-index:1;
    width:min(900px,100%);
    margin:0 auto;
    padding:clamp(22px,4.5vw,58px) clamp(14px,3.5vw,28px) calc(clamp(28px,5vw,60px) + env(safe-area-inset-bottom));
  }
  .card{
    position:relative;
    overflow:hidden;
    padding:clamp(26px,5vw,52px) clamp(20px,4.6vw,54px) clamp(24px,4.5vw,46px);
    background:linear-gradient(180deg,#fffefa 0%,var(--card) 45%,#fdf8ed 100%);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
  }
  .card::before{
    content:"";
    position:absolute;
    inset:11px;
    border:1px solid rgba(140,47,36,.10);
    border-radius:14px;
    pointer-events:none;
  }
  .card::after{
    content:"";
    position:absolute;
    left:12%;
    right:12%;
    top:0;
    height:3px;
    background:linear-gradient(90deg,transparent,var(--gold),var(--red),var(--gold),transparent);
    opacity:.8;
  }
  .corner{
    position:absolute;
    width:22px;
    height:22px;
    border-color:rgba(193,154,75,.65);
    border-style:solid;
    pointer-events:none;
  }
  .corner.tl{top:18px;left:18px;border-width:1px 0 0 1px;border-top-left-radius:8px;}
  .corner.tr{top:18px;right:18px;border-width:1px 1px 0 0;border-top-right-radius:8px;}
  .corner.bl{bottom:18px;left:18px;border-width:0 0 1px 1px;border-bottom-left-radius:8px;}
  .corner.br{bottom:18px;right:18px;border-width:0 1px 1px 0;border-bottom-right-radius:8px;}
  .watermark{
    position:absolute;
    right:-26px;
    bottom:-52px;
    font-family:"STKaiti","KaiTi","Kaiti SC","SimSun",serif;
    font-size:250px;
    line-height:1;
    color:rgba(140,47,36,.04);
    pointer-events:none;
    user-select:none;
  }
  .hero{position:relative;text-align:center;}
  .emblem{
    width:60px;
    height:60px;
    margin:0 auto 16px;
    display:grid;
    place-items:center;
    border-radius:50%;
    color:#fff6e6;
    font-family:"STKaiti","KaiTi","Kaiti SC","SimSun",serif;
    font-size:27px;
    line-height:1;
    background:radial-gradient(circle at 35% 28%,#a83a2e,#7a211a 72%);
    box-shadow:
      0 12px 26px -12px rgba(109,31,24,.85),
      inset 0 0 0 2px rgba(255,240,210,.55),
      inset 0 0 0 6px rgba(109,31,24,.9);
  }
  h1{
    margin:0;
    font-size:clamp(30px,5.4vw,46px);
    font-weight:700;
    letter-spacing:.16em;
    text-indent:.16em;
    color:var(--red-deep);
    text-shadow:0 1px 0 #fff, 0 10px 26px rgba(109,31,24,.12);
  }
  .subtitle{
    max-width:640px;
    margin:14px auto 0;
    color:var(--muted);
    font-size:clamp(13px,2.2vw,15px);
    line-height:1.95;
    letter-spacing:.04em;
  }
  .subtitle .wide{display:none;}
  .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    max-width:340px;
    margin:22px auto 0;
  }
  .ornament .rule{
    flex:1;
    height:1px;
    background:linear-gradient(90deg,transparent,var(--gold-soft));
  }
  .ornament .rule:last-child{background:linear-gradient(90deg,var(--gold-soft),transparent);}
  .ornament .gem{
    width:8px;
    height:8px;
    background:var(--red);
    transform:rotate(45deg);
    box-shadow:0 0 0 3px rgba(140,47,36,.12);
  }
  .picker{margin-top:clamp(26px,4.2vw,36px);}
  .field-label{
    display:block;
    margin-bottom:12px;
    color:var(--ink-soft);
    font-size:clamp(15px,2.4vw,17px);
    letter-spacing:.06em;
    text-align:center;
  }
  .controls{display:flex;align-items:stretch;justify-content:center;gap:14px;}
  .select-wrap{position:relative;flex:0 1 360px;max-width:360px;}
  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    font:inherit;
    font-size:16px;
    color:var(--ink);
    letter-spacing:.05em;
    padding:13px 48px 13px 16px;
    background:linear-gradient(180deg,#fffdf8,#faf4e7);
    border:1px solid #d9c7a5;
    border-radius:12px;
    box-shadow:inset 0 1px 0 #fff, 0 2px 6px rgba(100,70,30,.06);
    cursor:pointer;
    transition:border-color .2s, box-shadow .2s;
  }
  select,.test-btn{min-height:50px;}
  select:hover{border-color:#c6ad80;}
  select:focus{
    outline:none;
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(140,47,36,.12), inset 0 1px 0 #fff;
  }
  .chev{
    position:absolute;
    right:16px;
    top:50%;
    width:18px;
    height:18px;
    transform:translateY(-50%);
    color:var(--red);
    pointer-events:none;
  }
  .test-btn{
    flex:0 0 auto;
    font:inherit;
    font-size:16px;
    font-weight:700;
    letter-spacing:.14em;
    color:#fff9ee;
    padding:13px 30px 13px 34px;
    background:linear-gradient(180deg,#a03327,#7d2119);
    border:1px solid #6d1c15;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 12px 24px -10px rgba(109,31,24,.7), inset 0 1px 0 rgba(255,255,255,.22);
    transition:transform .18s, box-shadow .18s, filter .18s;
    touch-action:manipulation;
  }
  .test-btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.05);
    box-shadow:0 16px 28px -10px rgba(109,31,24,.75), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .test-btn:active{
    transform:translateY(1px);
    box-shadow:0 6px 14px -8px rgba(109,31,24,.7), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .test-btn:focus-visible{outline:3px solid rgba(193,154,75,.55);outline-offset:3px;}
  .result{
    position:relative;
    min-height:190px;
    margin-top:clamp(24px,4vw,36px);
    padding:clamp(20px,3.6vw,34px);
    background:linear-gradient(180deg,#fdfaf2,#faf3e4);
    border:1px solid var(--line);
    border-radius:16px;
  }
  .result::before{
    content:"";
    position:absolute;
    left:clamp(20px,3.6vw,34px);
    right:clamp(20px,3.6vw,34px);
    top:0;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(193,154,75,.55),transparent);
  }
  .empty{
    min-height:150px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
    padding:24px 10px;
    text-align:center;
    color:var(--muted);
    font-size:15px;
    letter-spacing:.08em;
  }
  .moon{
    position:relative;
    width:62px;
    height:62px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fdf3d4,#e8cd8f 70%,#d9b566);
    box-shadow:0 0 0 8px rgba(193,154,75,.08), 0 16px 30px -18px rgba(160,120,50,.8);
  }
  .moon::before,
  .moon::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(180,140,70,.20);
  }
  .moon::before{width:14px;height:14px;top:16px;left:14px;}
  .moon::after{width:9px;height:9px;bottom:14px;right:16px;}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 15px;
    color:var(--red);
    font-size:14px;
    font-weight:700;
    letter-spacing:.08em;
    background:rgba(140,47,36,.07);
    border:1px solid rgba(140,47,36,.18);
    border-radius:999px;
  }
  .badge::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 0 3px rgba(140,47,36,.10);
  }
  h2{
    margin:16px 0 14px;
    color:var(--red-deep);
    font-size:clamp(20px,3.4vw,25px);
    font-weight:700;
    letter-spacing:.1em;
  }
  h2::after{
    content:"";
    display:block;
    width:46px;
    height:2px;
    margin-top:10px;
    background:linear-gradient(90deg,var(--gold),transparent);
  }
  .result-body{
    color:#3b3025;
    font-size:clamp(15px,2.6vw,17px);
    line-height:2.08;
    text-align:justify;
    text-indent:2em;
    letter-spacing:.01em;
  }
  .content.show{animation:reveal .5s cubic-bezier(.2,.8,.25,1) both;}
  @keyframes reveal{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:none;}
  }
  [hidden]{display:none !important;}
  @media (min-width:600px){
    .subtitle .wide{display:inline;}
  }
  @media (max-width:560px){
    .card{border-radius:18px;}
    .corner{width:16px;height:16px;}
    .corner.tl{top:14px;left:14px;}
    .corner.tr{top:14px;right:14px;}
    .corner.bl{bottom:14px;left:14px;}
    .corner.br{bottom:14px;right:14px;}
    .watermark{font-size:170px;right:-18px;bottom:-34px;}
    .controls{flex-direction:column;}
    .select-wrap{max-width:none;flex:1 1 auto;}
    .test-btn{width:100%;padding-left:30px;}
    .result{min-height:170px;}
    .result-body{text-align:left;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important;}
  }
</style>
</head>
<body>
<div class="page">
  <main class="card">
    <span class="corner tl" aria-hidden="true"></span>
    <span class="corner tr" aria-hidden="true"></span>
    <span class="corner bl" aria-hidden="true"></span>
    <span class="corner br" aria-hidden="true"></span>
    <span class="watermark" aria-hidden="true">運</span>

    <header class="hero">
      <div class="emblem" aria-hidden="true">運</div>
      <h1>中国农历运程</h1>
      <p class="subtitle">来自古代中国农历历法记载，分析出三十种不同人格运数，<br class="wide">特性规律，极有参考的价值！！</p>
      <div class="ornament" aria-hidden="true">
        <span class="rule"></span>
        <span class="gem"></span>
        <span class="rule"></span>
      </div>
    </header>

    <form class="picker" id="form" autocomplete="off">
      <label class="field-label" for="day">请输入农历初几出生日子：</label>
      <div class="controls">
        <div class="select-wrap">
          <select id="day" name="day"></select>
          <svg class="chev" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 8l5 5 5-5"/>
          </svg>
        </div>
        <button class="test-btn" type="submit">开始测试</button>
      </div>
    </form>

    <section class="result" id="result" aria-live="polite">
      <div class="empty" id="empty">
        <div class="moon" aria-hidden="true"></div>
        <p>选择农历出生日子，点“开始测试”</p>
      </div>
      <div class="content" id="content" hidden>
        <div class="badge" id="badge"></div>
        <h2 id="result-title"></h2>
        <div class="result-body" id="result-text"></div>
      </div>
    </section>
  </main>
  <noscript><p style="text-align:center;color:#8a7963;">请启用 JavaScript 后使用。</p></noscript>
</div>

<script>
(function () {
